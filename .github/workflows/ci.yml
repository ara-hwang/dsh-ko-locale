# Verifies every push and pull request. The publish workflow runs the same
# checks again before it uploads, so a failure here is a preview, not a gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # The pack has no dependencies, so there is nothing to install and no
          # lockfile for `npm ci` to read.
          package-manager-cache: false

      - name: Build the browser bundle
        run: npm run build

      # The bundle is committed, so it can lag the data that produces it. Both
      # the diff and the check catch that: the diff catches a stale commit, the
      # check catches a bundle that was never rebuilt.
      - name: Fail when the committed bundle is stale
        run: git diff --exit-code -- lib/

      - name: Check the shipped dictionaries
        run: npm run check
