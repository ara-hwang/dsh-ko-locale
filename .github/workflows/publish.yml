# Publishes to npm from GitHub Actions using OIDC trusted publishing, so no
# npm token exists anywhere in this repository or its secrets.
#
# Two things outside this file must line up, and neither is verified by npm at
# configuration time — a mismatch only shows up as ENEEDAUTH when this runs:
#
#   1. npmjs.com -> the package -> Settings -> Trusted publishing must name
#      GitHub Actions, this repository, and this filename (`publish.yml`), and
#      must have "Allow npm publish" selected. A configuration created now is
#      automatically granted `npm stage publish` only, which is the staged flow
#      that waits for a maintainer approval.
#   2. `repository.url` in package.json must match this repository exactly.
#
# The runtime smoke test cannot run here: it reads the LocaleRuntime out of an
# installed DSH application, which no runner has. `npm run check` is the
# portable gate instead — see tools/check-data.mjs.
#
# A tag push also leaves a GitHub Release behind, with notes GitHub generates
# from the commits. npm remains the distribution channel; the release page is the
# human-readable record. An existing release is never overwritten, so notes a
# maintainer edited by hand survive a workflow re-run.

name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # the GitHub Release created below
  id-token: write # the OIDC token npm exchanges for a short-lived publish token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      # `npm publish` runs prepublishOnly, which rebuilds the bundle and checks
      # the dictionaries. Running the build first means the staleness check
      # below compares against a fresh build rather than the commit.
      - name: Rebuild the browser bundle
        run: npm run build

      - name: Fail when the committed bundle is stale
        run: git diff --exit-code -- lib/

      - name: Check the shipped dictionaries
        run: npm run check

      # No NODE_AUTH_TOKEN: setting one would make npm use the token instead of
      # the OIDC identity, which is the whole point of trusted publishing.
      # Provenance is generated automatically for a public package in a public
      # repository.
      - name: Publish
        run: npm publish

      # Runs after the publish on purpose: the npm release is already out, so a
      # failure here costs a release page, not a version. The existence check
      # makes a re-run idempotent and keeps hand-edited notes.
      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving its notes alone"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
